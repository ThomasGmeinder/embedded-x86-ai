[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-smolvla"
version = "0.1.0"
description = "MuJoCo SO-101 digital twin driven by a fine-tuned SmolVLA policy"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
  "mujoco>=3.1.3",
  "numpy",
  "PyYAML",
  # The utilization and power table (so101_smolvla.utilization_window): Qt 6 through the official
  # Python binding; the sampler and open_meters() stay standard library.
  "PySide6-Essentials>=6.12",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
so101_smolvla = ["*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
