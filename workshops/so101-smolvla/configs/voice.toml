# The voice path around the model: the Gemma server's address, one request, the
# microphone session and the synthetic voice. Read by so101_smolvla.voice.settings.
#
# Which Gemma model runs, and on which processor, is not here: that is the
# [command] section of configs/models.toml. Everything in this file applies to
# both of its backends.

[server]
host = "127.0.0.1"
port = 8082         # the notebook's and the default
runner_port = 8083  # where the three-cube runner and the tests start their own server,
                    # so a server the user runs on the default port is left alone

[request]  # one chat completion
temperature = 0.0
max_tokens = 48  # the command's words (six tokens at most) plus the short "heard" phrase
timeout_s = 30

[listening]
sample_rate = 16000
# mic_device is left out: the system's default microphone. A device index or name
# here selects another.
# A frame quieter than this is not speech, whatever the detector says. Levels are of the sound
# with the microphone's constant offset taken out. Measured on this machine's built-in
# microphone, 2026-11-23: a person's speech frames -56 to -28 dBFS (median -43), the room
# -61 to -48. Speech and room overlap, so the level cannot tell them apart here: at -60 this
# does not hold speech back and the detector decides. (It was -35 and never closed: the
# offset alone read -30.)
min_dbfs = -60
vad_threshold = 0.5  # Silero's probability from which a frame counts as speech
# A window goes to Gemma with its loud samples at this share of full scale, the synthetic
# test voice's level, raised by most_gain at most: Gemma hears quiet sound worse.
sent_peak = 0.5
most_gain = 20
# Listening without an end-of-speech event (so101_smolvla.voice.continuous), the way of
# ~/GitHub/voice_intent, taken over 2026-11-27; the values and their measurements are that
# project's (its README and RESEARCH_LEDGER.md).
# The newest sound Gemma gets each time it is free. Gemma follows the speech a window begins
# with, so a shorter window loses fewer commands to other people's talk; a longer one is not
# slower. A pick command that goes on after a pause is asked about with up to twice this.
window_s = 3
min_voice_ms = 100   # less new speech than this (a click, a cough) sends nothing
# When someone begins to speak after a second of silence, the first window is sent at the
# speaker's next short pause, or when the talk has gone on this long: sent at once it would
# hold the first syllable only. Longer than a short command; where someone always talks it
# changes nothing.
enough_speech_ms = 2500
# What is quieter than a window's loud speech by more than this is silenced before the window
# is sent: talk in the background. 0 turns it off.
quiet_gate_db = 8
max_age_s = 10       # an answer for sound older than this is not acted on

[synthetic_voice]
library = "libespeak-ng.so.1"
voice = "en-us"
words_per_minute = 150
peak = 0.5
lead_s = 0.5
clip_s = 6  # the quiet clip one test sentence is put into: longer than the longest of them
