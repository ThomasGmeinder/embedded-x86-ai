# The voice path around the model: the Gemma server's address, one request, the
# microphone session and the synthetic voice. Read by so101_smolvla.voice.settings.
#
# Which Gemma model runs, and on which processor, is not here: that is the
# [command] section of configs/models.toml. Everything in this file applies to
# both of its backends.

[server]
host = "127.0.0.1"
port = 8082         # the notebook's and the default
runner_port = 8083  # where the three-cube runner and the tests start their own server,
                    # so a server the user runs on the default port is left alone

[request]  # one chat completion
temperature = 0.0
max_tokens = 96  # the command JSON plus the short "heard" phrase
timeout_s = 30

[listening]
sample_rate = 16000
# mic_device is left out: the system's default microphone. A device index or name
# here selects another.
window_s = 6
hop_s = 2
min_dbfs = -35
vad_threshold = 0.5
min_voice_ms = 100
cooldown_s = 5
max_age_s = 10

[synthetic_voice]
library = "libespeak-ng.so.1"
voice = "en-us"
words_per_minute = 150
peak = 0.5
lead_s = 0.5
