# The MuJoCo twin: its cameras, the task sentence and the cube places of the
# scripted recordings and the fixed scenarios.

task = "Pick up a cube and place in the bin."

# One episode at each of these. They are far enough apart in the overhead
# camera that the cube is not hidden under the arm and not already in the jaws.
distinct_cube_positions = [
  [0.14, 0.18],
  [0.14, 0.06],
  [0.18, -0.06],
  [0.22, 0.10],
  [0.30, -0.02],
  [0.30, 0.06],
]

# Camera seats from the KIT URDF optical frames (Xbotics-SO101-Sim).
# The renderer reads the XML. These numbers are that same pose.
# Top is on base_link plus the published optical shift (-0.002, 0.027, 0).
# Wrist is on gripper_link. Both vertical fields are 59.17 deg.
# Quaternions are wxyz. MuJoCo looks along -Z.

[top_camera]
name = "top"
pos_m = [0.0490126, 0.121504, 0.528474]
quat_wxyz = [0.693521, 0.137949, -0.137948, -0.693519]
fovy_deg = 59.17

[wrist_camera]
name = "wrist_cam"
pos_m = [0.0025, 0.0726726, 0.00511534]
quat_wxyz = [0.976296, -0.216438, 0.0, 0.0]
fovy_deg = 59.17

[gripper]
closed_is_low_end = true

# Episode 484 of the cube40 training set. The cube is 40 mm.
[episode_484]
cube_m = [0.302, -0.037, 0.02]
bin_m = [0.249, 0.071]
