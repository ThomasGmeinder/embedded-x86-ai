[pytest]
# MoveIt 2 on the twin, with launch_pytest - ./run_sim_tests.sh runs this
# directory in its own process: a launch service replaces Python's logger
# class, which would leave the twin suite's caplog empty.
markers =
    sim: digital-twin scenario
pythonpath = ../sim
addopts = -p no:cacheprovider -ra -p no:launch_testing -p no:launch_ros
# Hang guard only: every wait is on an event with its own bound.
timeout = 300
log_level = INFO
log_format = %(asctime)s.%(msecs)03d %(levelname)s %(name)s [%(threadName)s]: %(message)s
log_date_format = %H:%M:%S
testpaths = .
