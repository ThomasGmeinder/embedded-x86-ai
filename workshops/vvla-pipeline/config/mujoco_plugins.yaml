# The twin's mujoco_ros2_control plugins (launch/so101_control.launch.py, hardware_type:=mujoco):
# the wrist and scene cameras on the topics cameras.<role>.topic names in pipeline.yaml,
# and every prop's pose on /free_joint_states. The mount camera is the real webcam,
# so mount_cam is not published onto cameras.mount.topic.
/**:
  ros__parameters:
    mujoco_plugins:
      cameras:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 30.0
        wrist_cam:
          frame_name: wrist_cam_optical_frame
          image_topic: /cameras/arm/image_raw
          info_topic: /cameras/arm/camera_info
          depth_topic: /cameras/arm/depth
        scene_cam:
          image_topic: /cameras/scene/image_raw
          info_topic: /cameras/scene/camera_info
          depth_topic: /cameras/scene/depth
        mount_cam:
          policy: disabled
      props:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
        topic: /free_joint_states
        publish_rate: 30.0
